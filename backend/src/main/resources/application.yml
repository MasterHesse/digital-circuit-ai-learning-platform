server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.springframework.ai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

spring:
  config:
    import: optional:file:./.env[.properties]

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j_pwd

  datasource:
    url: jdbc:postgresql://localhost:5433/diglearn
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}

      chat:
        completions-path: /v1/chat/completions
        options:
          model: ${AI_DEFAULT_CHAT_MODEL:qwen-turbo}
          temperature: 0.2
          extra-body:
            enable_thinking: ${AI_DEFAULT_THINKING:false}
            thinking_budget: ${AI_DEFAULT_THINKING_BUDGET:1024}

      embedding:
        embeddings-path: /v1/embeddings
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

    vectorstore:
      pgvector:
        table-name: ai_vector_store
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true
        remove-existing-vector-store-table: false
        schema-validation: true
        max-document-batch-size: 10000

diglearn:
  ai:
    enabled: true
    mode: live

    default-chat-model: ${AI_DEFAULT_CHAT_MODEL:qwen-turbo}
    default-thinking: ${AI_DEFAULT_THINKING:false}
    default-thinking-budget: ${AI_DEFAULT_THINKING_BUDGET:1024}

    allowed-chat-models-csv: ${AI_ALLOWED_CHAT_MODELS:qwen-turbo,qwen-plus,qwen-flash}
    reasoning-capable-models-csv: ${AI_REASONING_CAPABLE_MODELS:qwen-turbo,qwen-plus,qwen-flash}

    rag:
      top-k: 6
      similarity-threshold: 0.70
      corpus:
        mode: db # seed | db
      indexing:
        chunk-size: 350
        min-chunk-size-chars: 120
        min-chunk-length-to-embed: 20
        max-num-chunks: 10000
        keep-separator: true        
      reindex-on-startup: false